server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: eldercare-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:eldercare}
    username: ${DB_USER:eldercare}
    password: ${DB_PASSWORD:eldercare_pwd}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # 生产环境请通过环境变量覆盖为 >=32 字节的随机密钥
    secret: ${JWT_SECRET:eldercare-platform-demo-jwt-secret-key-please-change-0123456789}
    expiration-ms: 86400000

logging:
  level:
    org.flywaydb: INFO
    com.eldercare: INFO
